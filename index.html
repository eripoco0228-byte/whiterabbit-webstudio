<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>white rabbit WEB STUDIO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --header-bg: #B9D8DE;        /* ペールブルー */
      --header-dark: #586064;      /* チャコールグレー */
      --bg-main: #F9F6F0;        /* ミルクティーベージュ */
      --text-main: #FFFFFF;        /* スマホ・PC共通で文字色を白に統一 */
      --text-dark: #332F2C;
      --accent-green: #06C755;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
    }

    /* --- ヘッダー領域 --- */
    .site-header {
      background-color: var(--header-bg);
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 新しいロゴ画像 */
    .site-logo {
      height: 45px;
      width: auto;
      object-fit: contain;
    }

    /* 右上：枠・背景・アイコンを消してシンプルな白文字に設定 */
    .header-badge-text {
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* --- メインビジュアル領域 --- */
    .hero-section {
      position: relative;
      width: 100%;
      min-height: 420px;
      background: url('DSC04399.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    /* 写真上の暗めオーバーレイ（文字を白でくっきり見せるため） */
    .hero-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      color: var(--text-main); /* PC・スマホ共通で文字色を完全に白に固定 */
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 15px;
      color: #FFFFFF; /* 明示的に白指定 */
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .hero-sub {
      font-size: 1.05rem;
      font-weight: 500;
      color: #FFFFFF; /* 明示的に白指定 */
      text-shadow: 0 1px 5px rgba(0,0,0,0.3);
    }

    /* モバイル調整 */
    @media (max-width: 768px) {
      .site-header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
      .site-logo {
        height: 38px;
      }
      .header-badge-text {
        font-size: 0.85rem;
      }
      .hero-title {
        font-size: 1.4rem;
      }
      .hero-sub {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <!-- 新ロゴ画像（WEB STUDIOロゴ_2.png） -->
    <img src="WEB STUDIOロゴ_2.png" alt="white rabbit WEB STUDIO" class="site-logo">
    
    <!-- 枠・背景・葉っぱを消した白文字表記 -->
    <div class="header-badge-text">
      \ 当レンタルサロン利用者様限定 /
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">
        あなたのサロンの魅力を<br>シンプルで美しいWebサイトに
      </h1>
      <p class="hero-sub">
        現場を知るサロンオーナーが作る、セラピスト・施術者様のためのWeb制作
      </p>
    </div>
  </section>

</body>
</html>
